name: ejecutar notebook con salidas

on:
  push:
    paths:
      - '.github/workflows/ejecutar-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install --quiet nbconvert ipykernel pandas matplotlib scikit-learn
      - name: Cabecera para el reclutador
        run: |
          python - <<'PY'
          import nbformat
          from nbformat.v4 import new_markdown_cell

          RUTA = 'German_Credit_Data.ipynb'
          TEXTO = '''[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Nicolenki7/German_Credit_Scoring_Data/blob/main/German_Credit_Data.ipynb)

> **En 30 segundos:** 1 de cada 3 créditos acaba en impago y el plazo manda más que el perfil: por encima de 36 meses la mora llega al 52 %.
>
> - 300 de 1.000 créditos impagados (30 %)
> - Plazo mayor a 36 meses: 51,7 % de impago; hasta 12 meses: 21,2 %
> - Variable con más peso en el modelo: estado de cuenta por debajo de 0
>
> Los resultados ya están ejecutados: no hace falta correr nada para leerlos.'''

          nb = nbformat.read(RUTA, as_version=4)
          primero = ''.join(nb.cells[0].source) if nb.cells else ''
          if 'En 30 segundos' not in primero:
              nb.cells.insert(0, new_markdown_cell(TEXTO))
              nbformat.write(nb, RUTA)
              print('cabecera insertada')
          else:
              print('cabecera ya presente')
          PY
      - name: Ejecutar
        run: jupyter nbconvert --to notebook --execute --inplace "German_Credit_Data.ipynb" --ExecutePreprocessor.timeout=900
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "German_Credit_Data.ipynb"
          git commit -m "chore: notebook ejecutado con salidas guardadas" || echo "sin cambios"
          git push
